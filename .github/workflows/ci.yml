# Tests and static analysis on every push.
#
# This is the gate that did not exist. `jobs.yml` runs the scheduled season
# jobs; nothing ever ran the test suite or the analysers automatically, so the
# entire quality apparatus was opt-in by memory. Both recurring defect classes
# in this repository - code written and never connected, and a model refactored
# without its callers - are inside the competence of the tools below, and both
# shipped anyway because nothing ran them.
#
# mypy gates. It reached zero by fixing the errors, not by loosening the
# configuration, and it caught a live ImportError on the way: `fcc doctor`
# imported a function that had been deleted an hour earlier, reachable only on
# a hosted run with a SQLite fallback - a branch no test enters.
#
# Everything here is also runnable in one command locally - `python tools/gate.py`
# - and the pre-push hook in .githooks runs it automatically. CI and the hook
# execute the SAME list in the SAME order on purpose: a gate that disagrees with
# the one on the developer's machine teaches people to ignore whichever is
# noisier.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deliberately NO secrets. The suite must never reach the hosted database,
    # and conftest.py enforces that from the other side.
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Lint
        run: python -m ruff check src dashboard.py fcc.py tests

      - name: Types
        run: python -m mypy src dashboard.py fcc.py

      - name: Silent degradation
        run: python tools/check_degradation.py

      - name: Dead code
        run: python -m vulture src dashboard.py fcc.py --min-confidence 80

      - name: Security
        run: python -m bandit -r src -q -ll -c .bandit
