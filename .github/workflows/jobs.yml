name: Scheduled jobs

# Runs the season jobs in GitHub's infrastructure so nothing depends on a
# machine at home being awake. Each cron below maps to one command; the step
# picks the command from which schedule fired.
#
# Times are UTC (GitHub Actions offers no timezone setting) and are written for
# US Eastern during daylight saving, i.e. UTC-4. After DST ends in early
# November every job lands an hour later in local time. That is harmless here:
# the Tuesday waiver run still completes well before Yahoo processes waivers at
# game time, and every job is idempotent.

on:
  schedule:
    - cron: "0 11 * * 2"   # Tue 07:00 ET - waiver analyzer
    - cron: "0 12 * * *"   # daily 08:00 ET - injury monitor
    - cron: "0 14 * * 4"   # Thu 10:00 ET - lineup (TNF lock)
    # 10:30 ET, not 09:00. Thursday 10:00 to Sunday 09:00 is 71 hours and
    # the dedup window is 72, so an unchanged Thursday recommendation
    # silently suppressed Sunday's - the last email before kickoff, and
    # the one that matters most.
    - cron: "30 14 * * 0"   # Sun 10:30 ET - lineup
    - cron: "0 11 * * 3"   # Wed 07:00 ET - bye / horizon planner
    - cron: "0 12 * * 1"   # Mon 08:00 ET - recap + trade scout
    - cron: "0 11 * * 4"   # Thu 07:00 ET - deadline reminders
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "daily"
        type: choice
        options: [daily, sync, waivers, injuries, lineup, byes, recap, trades, reminders, test-notify, doctor]

concurrency:
  # Never let two runs write to the database at once.
  group: fantasy-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 45, not 20. `fcc sync` alone takes 15+ minutes (thousands of single-row
    # writes over a remote database) and the budget also covers doctor and the
    # job itself, so the runs on 18 and 19 Sep were cancelled mid-sync and
    # neither the injury monitor nor anything after it ran. The real fix is to
    # make sync fast; this stops the mornings being lost while that happens.
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      YAHOO_CONSUMER_KEY: ${{ secrets.YAHOO_CONSUMER_KEY }}
      YAHOO_CONSUMER_SECRET: ${{ secrets.YAHOO_CONSUMER_SECRET }}
      YAHOO_ACCESS_TOKEN_JSON: ${{ secrets.YAHOO_ACCESS_TOKEN_JSON }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which job to run
        id: pick
        # Asked of the app rather than repeated here. This step used to hold a
        # copy of every cron, and it drifted: the Sunday run moved to 10:30 ET
        # and the copy kept matching 09:00, so Sunday would have run the wrong
        # job. src/schedule.py is the one list.
        run: |
          CHOSEN="${{ github.event.inputs.job }}"
          if [ -z "$CHOSEN" ]; then
            CHOSEN="$(python fcc.py which-job --cron "${{ github.event.schedule }}")"
          fi
          echo "job=$CHOSEN" >> "$GITHUB_OUTPUT"

      - name: Verify database is reachable
        run: python fcc.py doctor

      - name: Refresh data
        # Projections, injuries and trending must be current before any job
        # reasons about them. A delivery check needs none of that.
        if: steps.pick.outputs.job != 'test-notify' && steps.pick.outputs.job != 'doctor'
        run: python fcc.py sync

      - name: Refresh opportunity data
        # player_week_usage is filled by this command and by nothing else, and
        # every analytic built on it - prior-season regression flags, the
        # expected-points signals, measured volatility - reads from it. Left
        # uncalled it stays empty forever and all of that silently does nothing.
        #
        # Monday, because that is when the previous week's stats are final.
        if: steps.pick.outputs.job == 'recap'
        run: python fcc.py sync-usage
        continue-on-error: true

      - name: Run ${{ steps.pick.outputs.job }}
        run: python fcc.py ${{ steps.pick.outputs.job }}

      - name: Trade scout
        # Piggybacks on the Monday recap run rather than burning its own slot.
        if: steps.pick.outputs.job == 'recap'
        run: python fcc.py trades

      - name: Reminders
        # Deadlines matter most on the days a lineup or claim is due, so they
        # ride along with those runs instead of getting their own schedule.
        if: steps.pick.outputs.job == 'lineup' || steps.pick.outputs.job == 'waivers'
        run: python fcc.py reminders

      - name: Has Yahoo attached Fantasy Sports yet?
        # One unauthenticated request a morning, riding the daily injury run.
        # Notifies the day Yahoo attaches the scope, and goes quiet once a
        # token exists. always() so a failed job above does not hide it, and
        # a failure here comes after the job has already run.
        #
        # The Client ID arrives under its own secret, scoped to this step. As
        # YAHOO_CONSUMER_KEY it would make every job above consider Yahoo
        # configured and try to authenticate with no token.
        if: always() && steps.pick.outputs.job == 'injuries'
        env:
          YAHOO_CONSUMER_KEY: ${{ secrets.YAHOO_CLIENT_ID }}
        run: python fcc.py yahoo-scope

      - name: Anything due today that did not run
        # GitHub dropped a scheduled run entirely on 2026-09-20 and delivered
        # another three hours late, so the Sunday lineup mail never went out
        # and nothing noticed. Every run now ends by asking what was due and
        # has not happened, runs it, and reports what it cannot recover.
        # always(), because a failed job above is exactly when this matters.
        if: always() && steps.pick.outputs.job != 'test-notify'
        run: python fcc.py catchup

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
