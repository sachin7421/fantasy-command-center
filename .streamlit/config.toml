# Theme for the Fantasy Command Center dashboard.
#
# Light, neutral surfaces with bright accents (the user's ask, 7 Oct 2026).
# Every colour that carries text was checked against both surfaces: ink
# 15.4:1, muted 5.6:1, the five position hues 4.6-6.6:1, the semantic
# colours 4.7-6.0:1 (tools: WCAG relative luminance). Orange is a fill
# accent only - at 2.6:1 it never carries text.

[theme]
base = "light"

# Bright blue. Reserved for actions and the selected state.
primaryColor = "#2563EB"

# Neutral page, white cards.
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1F24"

font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
